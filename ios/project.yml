name: ATOMMonitor
options:
  bundleIdPrefix: uk.co.rhine59
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
targets:
  ATOMMonitor:
    type: application
    platform: iOS
    sources:
      - path: ATOMMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.rhine59.ATOMMonitor
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ATOM Monitor
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: ATOM Monitor connects to your configured server to retrieve ATOM ground-station health information.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  ATOMMonitorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ATOMMonitorUITests
    dependencies:
      - target: ATOMMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.rhine59.ATOMMonitorUITests
        TEST_TARGET_NAME: ATOMMonitor
schemes:
  ATOMMonitor:
    build:
      targets:
        ATOMMonitor: all
        ATOMMonitorUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: ATOMMonitorUITests
