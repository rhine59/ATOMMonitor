services:
  postgres:
    image: postgres:17-alpine
    container_name: atommonitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atommonitor}
      POSTGRES_USER: ${POSTGRES_USER:-atommonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    volumes:
      - atommonitor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atommonitor} -d ${POSTGRES_DB:-atommonitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  atom-api:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - ./data:/data
    environment:
      ATOM_DB: /data/atommonitor.sqlite3
      ATOM_DATABASE_URL: ${ATOM_DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-atommonitor}
      POSTGRES_USER: ${POSTGRES_USER:-atommonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
      ATOM_INGEST_TOKEN: ${ATOM_INGEST_TOKEN:?Set ATOM_INGEST_TOKEN in server/.env}
      FEEDBACK_TO_NAME: ${FEEDBACK_TO_NAME:-Richard Hine}
      FEEDBACK_TO_EMAIL: ${FEEDBACK_TO_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ogn-station-probe:
    build:
      context: ./diagnostic
    container_name: atommonitor-ogn-probe
    restart: unless-stopped
    depends_on:
      atom-api:
        condition: service_healthy
    environment:
      ATOM_INGEST_TOKEN: ${ATOM_INGEST_TOKEN:?Set ATOM_INGEST_TOKEN in server/.env}
    command: ["--prefix", "PW", "--api-url", "http://atom-api:8080/api/v1/observations"]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  atommonitor-postgres-data:
