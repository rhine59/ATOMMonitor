services:
  atom-api:
    build:
      context: .
    container_name: atommonitor-api
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - ./data:/data
    environment:
      ATOM_DB: /data/atommonitor.sqlite3
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ogn-station-probe:
    build:
      context: ./diagnostic
    container_name: atommonitor-ogn-probe
    restart: unless-stopped
    depends_on:
      atom-api:
        condition: service_healthy
    command: ["--prefix", "PW", "--api-url", "http://atom-api:8080/api/v1/observations"]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
