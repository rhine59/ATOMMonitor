resolver 127.0.0.11 valid=10s ipv6=off;

upstream atommonitor_api {
    zone atommonitor_api 64k;
    server atom-api:8080 resolve;
}

server {
    listen 8080;

    # Restricted infrastructure monitoring. The admin monitor is a separate
    # service so the public station API never receives Docker access.
    location /api/v1/admin/ {
        proxy_pass http://atom-admin-monitor:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://atommonitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
